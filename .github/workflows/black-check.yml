name: black-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  black-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Black
        run: python -m pip install --upgrade pip black

      - name: Run Black check and capture output
        id: black_check
        run: |
          set +e
          black --check --diff . > black-output.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Black output artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-output-pr-${{ github.event.pull_request.number }}
          path: black-output.txt
          if-no-files-found: error

      - name: Fail when formatting changes are required
        if: steps.black_check.outputs.exit_code != '0'
        run: |
          echo "Black formatting changes detected."
          echo "See artifact black-output-pr-${{ github.event.pull_request.number }} for details."
          exit 1
