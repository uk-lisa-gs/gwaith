name: flake8-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  flake8-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Flake8
        run: python -m pip install --upgrade pip flake8

      - name: Run Flake8 check and capture output
        id: flake8_check
        run: |
          set +e
          flake8 . > flake8-output.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Flake8 output artifact
        uses: actions/upload-artifact@v4
        with:
          name: flake8-output-pr-${{ github.event.pull_request.number }}
          path: flake8-output.txt
          if-no-files-found: error

      - name: Fail when lint issues are found
        if: steps.flake8_check.outputs.exit_code != '0'
        run: |
          echo "Flake8 issues detected."
          echo "See artifact flake8-output-pr-${{ github.event.pull_request.number }} for details."
          exit 1