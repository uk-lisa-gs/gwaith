name: run generic example workflow

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 60
      matrix:
        os: [ubuntu-24.04]
        python-version: [3.11]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{matrix.python-version}}
    - name: Install gwaith
      run: |
        python -m pip install --upgrade pip setuptools
        pip install .
    - name: Run Bash example workflow
      env:
        GWAITH_EXPORTER: bash
      run: |
        cd examples/workflow/
        bash -e generate_example_data.sh
        bash -e build_workflow.sh
        bash -e workflow_out/run_workflow.sh
    - name: store log files
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ matrix.os }}-py${{ matrix.python-version }}
        path: examples/workflow/workflow_out/
