seed: 12345
epoch: 1200000000.0

sampling:
  delta_t: 5.0
  duration_days: 1.0

noise_psd:
  amplitude: 1.0e-1
  floor: 1.0e-4
  f_knee: 2.0e-4
  slope: -1.8

offset: 0.35

sine_waves:
  - amplitude: 1.20
    frequency: 1.50e-4
    phase: 0.10
  - amplitude: 0.80
    frequency: 3e-4
    phase: 1.20
  - amplitude: 0.50
    frequency: 1.2e-3
    phase: -0.70
  - amplitude: 0.90
    frequency: 1e-2
    phase: 2.00
  - amplitude: 0.65
    frequency: 4.5e-2
    phase: -1.40

output:
  directory: examples/out
  data_file: example_data.h5
  truth_file: example_truth.yaml
  plot_time_file: example_data_plot_time.png
  plot_frequency_file: example_data_plot_frequency.png
  data_dataset: data
