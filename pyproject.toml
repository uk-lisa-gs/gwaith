[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwaith"
version = "0.1.0"
description = "A workflow manager for gravitational-wave analysis pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "uk-lisa-gs" }]
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.21",
  "scipy>=1.7",
  "h5py>=3.0",
]

[project.optional-dependencies]
dev = [
  "flake8>=7.0",
  "pytest>=8.0",
]

[project.scripts]
gwaith_subtract_signals = "tools.subtraction.subtract_signals:main"
gwaith_consolidate_params = "tools.workflow.consolidate_params:main"
gwaith_estimate_psd = "tools.examples.estimate_psd:main"
gwaith_fit_sine = "tools.examples.fit_sine:main"
gwaith_fit_offset = "tools.examples.fit_offset:main"
gwaith_fit_sine_gaussian = "tools.examples.fit_sine_gaussian:main"
gwaith_build_workflow = "tools.workflow.build_workflow:main"
gwaith_consolidate_params = "tools.workflow.consolidate_params:main"
gwaith_ingest_data = "gwaith.tools.data.ingest_data:main"

[tool.setuptools]
package-dir = {"" = "src", "tools" = "tools"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["gwaith*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
